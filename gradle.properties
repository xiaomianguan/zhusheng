# Project-wide Gradle settings.

# Give the Gradle daemon a reasonable heap for Android builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# This project intentionally does NOT use AndroidX or the legacy support library.
# Everything is built on the plain Android framework so it runs on API 14+.
android.useAndroidX=false

# Keep the R class generation behavior classic (harmless with no dependencies).
android.nonTransitiveRClass=false

# The build needs a JDK that Gradle 8.7's bundled Groovy compiler can read: on a
# newer one (this machine's default `java` is JDK 26) any build script that names a
# JDK type - a Boolean in `buildFeatures { buildConfig true }` is enough - aborts with
# "Unsupported class file major version 70". The gradlew wrapper looks for a suitable
# JDK and points the build at it, so no path is pinned here; set JAVA_HOME yourself if
# yours lives somewhere the wrapper does not look.
